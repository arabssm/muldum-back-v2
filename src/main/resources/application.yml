server:
  port: 8080
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  cloud:
    aws:
      s3:
        bucket: ${AWS_BUCKET_NAME}
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
        region: ${AWS_BUCKET_REGION}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret-key: ${JWT_SECRET_KEY}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    token-url: ${GOOGLE_TOKEN_URL}
    user-info-url: ${GOOGLE_USER_INFO_URL}
google:
  sheets:
    credentials-path: ${GOOGLE_SHEETS_KEY_FILE_PATH}
  calendar:
    credentials-path: ${GOOGLE_CALENDAR_KEY_FILE_PATH:${GOOGLE_SHEETS_KEY_FILE_PATH}}
    default-calendar-id: ${GOOGLE_CALENDAR_ID:}
    application-name: ${GOOGLE_CALENDAR_APP_NAME:muldum-calendar}
    time-zone: ${GOOGLE_CALENDAR_TIME_ZONE:Asia/Seoul}
team:
  default-banner-image: ${DEFAULT_TEAM_BANNER_IMAGE}

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    co.kr.muldum.global.security: DEBUG
    org.hibernate.SQL: OFF

notion:
  oauth:
    client-id: ${NOTION_OAUTH_CLIENT_ID}
    client-secret: ${NOTION_OAUTH_CLIENT_SECRET}
    redirect-uri: ${NOTION_OAUTH_REDIRECT_URI}
  api-version: "2022-06-28"

app:
  frontend-url: ${FRONTEND_URL}

